name: ggen-fortune5

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  semantic-pack:
    runs-on: ubuntu-latest
    env:
      GGEN_VERSION: "26.8.15"
      GGEN_SHA256: "f4c4ea396f5cec12cfa2dd46c13ac620291f9b83138f17ded6fa59c510dcfc42"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install pinned ggen
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/seanchatmangpt/ggen/releases/download/v${GGEN_VERSION}/ggen-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --location --silent --show-error "$url" -o /tmp/ggen.tar.gz
          echo "${GGEN_SHA256}  /tmp/ggen.tar.gz" | sha256sum --check --strict
          mkdir -p /tmp/ggen-bin
          tar -xzf /tmp/ggen.tar.gz -C /tmp/ggen-bin
          ggen_bin="$(find /tmp/ggen-bin -type f -name ggen -perm -111 | head -n1)"
          test -n "$ggen_bin"
          echo "GGEN_BIN=$ggen_bin" >> "$GITHUB_ENV"
      - name: Generate twice and refuse non-idempotency
        working-directory: ggen/fortune5-fde-pack
        shell: bash
        run: |
          set -euo pipefail
          "$GGEN_BIN" --version
          timeout 5s "$GGEN_BIN" sync run
          cp generated/dimensions.md /tmp/dimensions.first.md
          timeout 5s "$GGEN_BIN" sync run
          cmp /tmp/dimensions.first.md generated/dimensions.md
      - name: Verify semantic closure and committed projection
        working-directory: ggen/fortune5-fde-pack
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -c '^| `' generated/dimensions.md)" -eq 13
          grep -F '| `capability-family` |' generated/dimensions.md
          grep -F '| `protocol` |' generated/dimensions.md
          grep -F '| `operation` |' generated/dimensions.md
          git diff -- generated/dimensions.md
          git diff --exit-code -- generated/dimensions.md
