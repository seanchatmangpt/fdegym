name: gym-maturity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Check 5x7 maturity contract
        run: python verify_maturity.py check
      - name: Manufacture deterministic evaluation receipt
        run: python verify_maturity.py evaluate --out gym-receipt.json
      - name: Replay receipt
        run: python verify_maturity.py replay gym-receipt.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gym-maturity-receipt
          path: gym-receipt.json
